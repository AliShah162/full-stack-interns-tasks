        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required class="mb-4 p-2 border border-gray-300 rounded">
        <p id="username-message" class="text-sm mb-4"></p>


        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required class="mb-4 p-2 border border-gray-300 rounded">
        <p id="password-message" class="text-sm mb-4"></p>

        <!-- //Button -->
        <button type="submit" class="bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition">Submit</button>
        <p class="text-red-500 mt-4" id="submit-errors"></p>
    </form>


<script>
    function handleSubmit(e){ //i didn't define this function and my border colors were not applying because js works line by line and if it didn't handleSubmit function it will crash right there and wont go ahead.
        e.preventDefault()
        if(usernameInput.classList.contains('border-red-500') || passwordInput.classList.contains('border-red-500')){
            document.getElementById('submit-errors').textContent='Please fix the errors before submitting!'
            
        }
        else{
            document.getElementById('submit-errors').textContent=''
            alert('Form submitted successfully!')
            form.reset()
            usernameInput.classList.remove('border-green-500')
            passwordInput.classList.remove('border-green-500')
            usernameMessage.textContent=''
            passwordMessage.textContent=''
        }
    }

    // no we are going to use errors[] to show errors
usernameInput.addEventListener('input',function(){
    const value=this.value
    const errors=[]
    value.length < 3 && errors.push('Too short');
    value.includes(' ') && errors.push('No spaces');
    value.length > 20 && errors.push('Too long');   

    this.classList.remove('border-red-500','border-green-500');
    if(errors.length>0){
        this.classList.add('border-red-500');
        usernameMessage.textContent=errors.join(', ')
        usernameMessage.className='text-red-500 text-sm mb-4'
    }
    else{
        this.classList.add('border-green-500');
        usernameMessage.textContent='Valid Username!'
        usernameMessage.className='text-green-500 text-sm mb-4'
    }
})
passwordInput.addEventListener('input',function(){
    const value=this.value
    const errors=[]
    value.length < 6 && errors.push('Too short');
    value.includes(' ') && errors.push('No spaces');
    value.length > 20 && errors.push('Too long');   
    !/[A-Z]/.test(value) && errors.push('Need uppercase letter');
    !/[0-9]/.test(value) && errors.push('Need a number');

    this.classList.remove('border-red-500','border-green-500');
    if(errors.length>0){
        this.classList.add('border-red-500');
        passwordMessage.textContent=errors.join(', ')
        passwordMessage.className='text-red-500 text-sm mb-4'
    }
    else{
        this.classList.add('border-green-500');
        passwordMessage.textContent='Valid Password!'
        passwordMessage.className='text-green-500 text-sm mb-4'
    }
})
