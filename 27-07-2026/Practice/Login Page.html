<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Page</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ---------- LOGIN CARD ---------- */
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
        }

        /* ---------- HEADER ---------- */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #1e3c72;
            font-weight: 700;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
            margin-top: 6px;
        }

        /* ---------- FORM ---------- */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.15);
        }

        /* ---------- OPTIONS ROW ---------- */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .options-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
            cursor: pointer;
        }

        .options-row a {
            color: #2a5298;
            text-decoration: none;
            font-weight: 600;
        }

        .options-row a:hover {
            text-decoration: underline;
        }

        /* ---------- BUTTON ---------- */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #16325e, #1e3c72);
            transform: scale(1.01);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* ---------- SIGNUP LINK ---------- */
        .signup-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .signup-link a {
            color: #2a5298;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .options-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .btn-login {
                font-size: 15px;
                padding: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- HEADER -->
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to your account</p>
        </div>

        <!-- FORM -->
        <form>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <div class="options-row">
                <label>
                    <input type="checkbox" /> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <!-- SIGNUP LINK -->
        <div class="signup-link">
            Don't have an account? <a href="Registration Form.html">Sign up</a>
        </div>

    </div>

</body>

<script>

    const password = document.getElementById('password');
    password.addEventListener('input',function(){
        if(this.value.length < 8){
            password.setCustomValidity('Password must be at least 8 characters long.');
        }
        else if(password.value.includes(' ')){
            password.setCustomValidity('Password cannot contain spaces.');
        }
        else{
            password.setCustomValidity('');
        }
    })

</script>
</html>
