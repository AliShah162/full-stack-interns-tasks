<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <!-- Container -->
    <div class="flex min-h-screen">

        <!-- ===== SIDEBAR ===== -->
        <aside id="sidebar" 
               class="w-64 bg-gray-800 text-white min-h-screen
                      fixed md:relative
                      -translate-x-full md:translate-x-0
                      transition-transform duration-300">
            
            <!-- Logo -->
            <div class="p-4 text-xl font-bold border-b border-gray-700">
                My App
            </div>

            <!-- Menu -->
            <nav class="p-4">
                <ul class="space-y-2">
                    <li><a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Dashboard</a></li>
                    <li><a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Users</a></li>
                    <li><a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Products</a></li>
                    <li><a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Orders</a></li>
                    <li><a href="#" class="block px-4 py-2 rounded hover:bg-gray-700">Settings</a></li>
                    <li class="pt-4 border-t border-gray-700">
                        <a href="#" class="block px-4 py-2 rounded hover:bg-red-600/20 text-red-400">Logout</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="flex-1 bg-gray-100 min-h-screen">

            <!-- Top Bar -->
            <header class="bg-white p-4 shadow-sm flex items-center justify-between">
                <button id="menuBtn" class="md:hidden text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <h1 class="text-lg font-semibold">Dashboard</h1>
                <div class="w-8 h-8 rounded-full bg-gray-300"></div>
            </header>

            <!-- Page Content -->
            <div class="p-6">
                <h2 class="text-2xl font-bold mb-4">Welcome!</h2>
                <p class="text-gray-600">Click the menu button on mobile to toggle sidebar.</p>
                
                <!-- Sample cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                    <div class="bg-white p-6 rounded shadow">
                        <h3 class="font-bold">Total Users</h3>
                        <p class="text-2xl">1,234</p>
                    </div>
                    <div class="bg-white p-6 rounded shadow">
                        <h3 class="font-bold">Revenue</h3>
                        <p class="text-2xl">$45K</p>
                    </div>
                    <div class="bg-white p-6 rounded shadow">
                        <h3 class="font-bold">Orders</h3>
                        <p class="text-2xl">567</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Overlay for mobile -->
    <div id="overlay" class="fixed inset-0 bg-black/50 hidden md:hidden"></div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>

</body>
</html>
