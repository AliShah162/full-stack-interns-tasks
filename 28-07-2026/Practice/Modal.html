<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <!-- ===== OPEN MODAL BUTTON ===== -->
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <button id="openModal" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition">
            Open Modal
        </button>
    </div>

    <!-- ===== MODAL OVERLAY ===== -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden">
        
        <!-- ===== MODAL BOX ===== -->
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">Simple Modal</h2>
                <button id="closeModal" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>

            <!-- Modal Body -->
            <p class="text-gray-600 mb-6">
                This is a simple modal. Click outside or the X button to close.
            </p>

            <!-- Modal Footer -->
            <div class="flex justify-end gap-2">
                <button id="cancelModal" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 transition">
                    Cancel
                </button>
                <button class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        const modal = document.getElementById('modalOverlay');
        const openBtn = document.getElementById('openModal');
        const closeBtn = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelModal');

        // Open modal
        openBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
        });

        // Close modal functions
        function closeModal() {
            modal.classList.add('hidden');
        }

        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);

        // Close on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
